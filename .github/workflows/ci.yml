# Checks every push and pull request: writing rules, API tests, web typecheck, tests, and build,
# and that the production container builds and serves the site.
# Written with Claude Code (Anthropic) assistance.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the code. They never write to the repository.
permissions:
  contents: read

jobs:
  text:
    name: Writing rules and UI coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_text.py
      - name: Every tool is still reachable from the UI
        run: python3 scripts/check_ui_coverage.py

  server:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q

  web:
    name: Web typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container and check that it serves the site and the API
        run: scripts/smoke_container.sh
