# Deploys main to Cloud Run once CI has passed on it. Only a green CI run on a push to main
# deploys, and it deploys exactly the commit that CI checked.
# Setup on the Google Cloud side is in docs/deploy.md, "Continuous deployment".
# Written with Claude Code (Anthropic) assistance.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time. A newer commit waiting in line replaces an older one that has not started.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  newest:
    name: Newest commit on main, pushed before the freeze
    # A pull request from a fork can have a branch named main too, so the event must be a push.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      # Deploys freeze at 11:00 pm Eastern on Nov 15, an hour before the 11:59 pm submission deadline,
      # to leave time to check the last deploy. A commit pushed before the freeze still deploys.
      # CI runs can finish out of order, and an old run can be re-run. Neither may roll the site back.
      - id: compare
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSHED_AT: ${{ github.event.workflow_run.created_at }}
          FREEZE_AT: "2026-11-16T04:00:00Z"
        run: |
          if [[ ! "$PUSHED_AT" < "$FREEZE_AT" ]]; then
            echo "::notice::Not deployed. Deploys froze at 11:00 pm Eastern on Nov 15, before the submission deadline."
            exit 0
          fi
          newest="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ "$newest" == "$HEAD_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed. A newer commit is on main, and it deploys after its own CI run."
          fi

  deploy:
    name: Deploy to Cloud Run
    needs: newest
    if: needs.newest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # id-token lets the job prove to Google Cloud that it is this workflow on main. No key is stored.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      # The code, plus the size of the service (Matt's decision, Nov 15, see docs/deploy.md "Size").
      # Two processors are all a first load can use, because the instance's network limit binds
      # first. The first generation runtime starts a new instance sooner. Three instances cost
      # less at the worst than the two larger ones did. The 4 GB hold a larger frame memory.
      # Public access, concurrency, the timeout, and the instance minimum are not named here,
      # so they keep their current settings.
      # SPX_CPUS must equal --cpu: Cloud Run does not tell the container how many it may use.
      - name: Build and deploy
        run: >-
          gcloud run deploy spherexplorer --source . --region us-east4 --quiet
          --execution-environment gen1 --cpu 2 --memory 4Gi --max-instances 3
          --update-env-vars SPX_FRAME_CACHE_MB=1024,SPX_CPUS=2
      - name: Check that the live site answers
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://spherexplorer-112779026983.us-east4.run.app/api/health
